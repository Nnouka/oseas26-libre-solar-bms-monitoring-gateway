services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # publishing succeeds only if the broker accepts connections
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck/ping -m ok -q 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bms-simulator:
    build: ./services/bms-simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_ENABLED: "false"       # the gateway publishes, the simulator only plays the BMS
      PUBLISH_INTERVAL_S: "5"
      SPEED: "60"
      SCENARIO: normal
    ports:
      - "8000:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      # the slim image has no curl, but it has Python
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  wifi-sim:
    build: ./services/wifi-sim
    environment:
      SOURCE: http://bms-simulator:8000/live # change this to tcp to mimic real bms
      MQTT_HOST: mosquitto
      DEVICE_ID: haske-bms-001
      PUBLISH_INTERVAL_S: "5"
    ports:
      - "8001:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
      bms-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
  mpm-ingestor:
      build: ./services/mpm-ingestor
      environment:
        MQTT_HOST: mosquitto
        MQTT_PORT: 1883
        MPM_BASE_URL: ${MPM_BASE_URL:-http://host.docker.internal:8000}
        MPM_API_KEY: ${MPM_API_KEY:-}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      ports:
        - "8012:8002"
      volumes:
        - mpm-ingestor-data:/data
      depends_on:
        mosquitto:
          condition: service_healthy
      restart: unless-stopped

volumes:
  mosquitto-data:
  ha-config:
  mpm-ingestor-data:
