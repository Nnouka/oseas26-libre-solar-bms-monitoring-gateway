[project]
name = "bms-bridge"
version = "0.1.0"
description = "Derives health metrics and fault events from raw BMS MQTT telemetry"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "bms-health",
]

[tool.uv.sources]
bms-health = { path = "../../packages/bms-health" }

[dependency-groups]
dev = ["pytest>=8"]
